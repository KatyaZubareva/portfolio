<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ekaterina Zubareva — designer portfolio">
    <title>Ekaterina Zubareva</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="hero">

        <header class="topbar">
            <div class="location">Moscow</div>

            <div class="theme" aria-label="Theme">
                <span>dark</span>
                <span class="active">light</span>
            </div>

            <div class="timezone">GMT + 3.00</div>
        </header>

        <section class="name-photo" aria-label="Ekaterina Zubareva">
            <div class="photo-inner">
                <div class="photo-mask">
                    <img
                        src="images/name-tape.png"
                        alt="Ekaterina Zubareva written with orange tape"
                        class="name-image"
                    >
                </div>
            </div>
        </section>

        <section class="bottom">
            <nav class="navigation" aria-label="Main navigation">
                <a href="#about" class="active">about</a>
                <a href="#work">work</a>
                <a href="#cv">cv</a>
                <a href="#connect">connect</a>
            </nav>

            <div class="statement">
                Design that<br>
                thinks before it<br>
                speaks.
            </div>

            <div class="statement">
                Redefining<br>
                what is<br>
                possible.
            </div>

            <button class="round-icon" type="button" aria-label="Open menu">
                <img src="images/Ellipse.svg" alt="">
            </button>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
